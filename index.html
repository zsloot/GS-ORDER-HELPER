<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Standard — Catering Order Helper</title>
  <style>
    :root {
      --color-bg: #faf9f6;
      --color-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #555;
      --color-accent: #2d6a4f;
      --color-accent-light: #d8f3dc;
      --color-border: #ddd;
      --color-error: #c0392b;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      padding: 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 2rem 0 1.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-accent);
    }

    header p {
      color: var(--color-text-secondary);
      margin-top: 0.25rem;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--color-accent);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 500px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--color-text-secondary);
    }

    input[type="number"], select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      background: var(--color-bg);
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px var(--color-accent-light);
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 400;
      font-size: 0.9rem;
      color: var(--color-text);
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      accent-color: var(--color-accent);
      width: 16px;
      height: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.15s;
    }

    .btn:hover { background: #235a3f; }

    .error-msg {
      color: var(--color-error);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    #results {
      display: none;
    }

    .order-section {
      margin-bottom: 1rem;
    }

    .order-section h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .order-table {
      width: 100%;
      border-collapse: collapse;
    }

    .order-table th,
    .order-table td {
      text-align: left;
      padding: 0.5rem 0.5rem;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    .order-table th {
      font-weight: 600;
      color: var(--color-text-secondary);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .order-table td:nth-child(2),
    .order-table th:nth-child(2) {
      text-align: center;
    }

    .order-table td:last-child,
    .order-table th:last-child {
      text-align: right;
    }

    .order-table .diet-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      margin-left: 0.35rem;
      vertical-align: middle;
    }

    .tag-v { background: #d8f3dc; color: #2d6a4f; }
    .tag-vg { background: #fde2c8; color: #b35e1c; }

    .item-desc {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin-top: 0.15rem;
    }

    .totals-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }

    .totals-table td {
      padding: 0.35rem 0.5rem;
      font-size: 0.9rem;
    }

    .totals-table td:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .totals-table .total-row td {
      font-weight: 700;
      font-size: 1.05rem;
      border-top: 2px solid var(--color-accent);
      padding-top: 0.5rem;
      color: var(--color-accent);
    }

    .note {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin-top: 0.75rem;
      font-style: italic;
    }

    .summary-banner {
      background: var(--color-accent-light);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--color-accent);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gold Standard — Catering Order Helper</h1>
      <p>Plan your catering order in seconds</p>
    </header>

    <div class="card">
      <h2>Group Details</h2>
      <div class="form-grid">
        <div class="field">
          <label for="totalPeople">Total People</label>
          <input type="number" id="totalPeople" min="1" max="500" value="10">
        </div>
        <div class="field">
          <label for="sandwichesPerPerson">Sandwiches per Person</label>
          <select id="sandwichesPerPerson">
            <option value="1">1 (light)</option>
            <option value="1.5" selected>1.5 (recommended)</option>
            <option value="2">2 (hearty)</option>
          </select>
        </div>
        <div class="field">
          <label for="vegetarians">Vegetarians</label>
          <input type="number" id="vegetarians" min="0" value="0">
        </div>
        <div class="field">
          <label for="vegans">Vegans</label>
          <input type="number" id="vegans" min="0" value="0">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Add Drinks</h2>
      <div class="checkbox-group">
        <label><input type="checkbox" id="addDrinksCoffee"> Coffee ($2.50/ea)</label>
        <label><input type="checkbox" id="addDrinksJuice"> Juice ($6.50/ea)</label>
        <label><input type="checkbox" id="addDrinksWater"> Water ($3.50/ea)</label>
        <label><input type="checkbox" id="addDrinksSoda"> Soda ($4.00/ea)</label>
      </div>
    </div>

    <button class="btn" onclick="generateOrder()">Generate Order Suggestion</button>
    <div id="errorMsg" class="error-msg"></div>

    <div id="results">
      <div class="card">
        <h2>Suggested Order</h2>
        <div id="summaryBanner" class="summary-banner"></div>

        <div class="order-section">
          <h3>Food</h3>
          <div style="overflow-x: auto;">
            <table class="order-table">
              <thead>
                <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
              </thead>
              <tbody id="sandwichRows"></tbody>
            </table>
          </div>
        </div>

        <div id="drinksSection" class="order-section" style="display:none;">
          <h3>Drinks</h3>
          <div style="overflow-x: auto;">
            <table class="order-table">
              <thead>
                <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
              </thead>
              <tbody id="drinksRows"></tbody>
            </table>
          </div>
        </div>

        <div class="order-section">
          <h3>Pricing</h3>
          <table class="totals-table">
            <tbody id="totalsRows"></tbody>
          </table>
        </div>

        <p class="note">
          All prices in CAD. Prices are estimates based on current menu and may vary.
          Contact us to finalize your catering order.
        </p>
      </div>
    </div>
  </div>

  <script>
    // ──────────────────────────────────────────────
    // Gold Standard menu data
    // Source: https://goldstandardsandwich.square.site
    // ──────────────────────────────────────────────

    const MENU = {
      // Meat / regular items
      regular: [
        {
          name: "Gold Standard Sandwich (Bacon)",
          desc: "Bacon, cheesy eggs, aioli, pickles, Marie Sharp's hot sauce, English muffin",
          price: 9.50,
          tags: [],
        },
        {
          name: "Gold Standard Sandwich (Bacon & Kale)",
          desc: "Bacon, kale, cheesy eggs, aioli, pickles, Marie Sharp's hot sauce, English muffin",
          price: 10.75,
          tags: [],
        },
        {
          name: "Bulldog Butty",
          desc: "Bacon, Bulldog sauce, Kewpie mayo, onion, hot sauce",
          price: 11.00,
          tags: [],
          note: "Queen St. exclusive",
        },
        {
          name: "Telway Burger",
          desc: "Detroit-style all-beef patty, mustard, pickles, onion, American cheese, Martin's potato roll",
          price: 9.50,
          tags: [],
        },
        {
          name: "Four Guys Burger",
          desc: "Beef patty, special sauce, lettuce, cheese, pickles, caramelized onion, Martin's potato roll",
          price: 13.00,
          tags: [],
        },
        {
          name: "Breakfast Burrito",
          desc: "Beef, cheesy eggs, avocado crema, chips, chipotle salsa, jalapeño, tortilla",
          price: 15.00,
          tags: [],
          note: "Queen St. exclusive",
        },
        {
          name: "Chicken Caesar Wrap",
          desc: "Fried chicken, bacon, aged Gouda, lemon-Maggi Caesar dressing, romaine, hickory sticks",
          price: 14.00,
          tags: [],
          note: "Harbourfront exclusive",
        },
      ],

      // Vegetarian items (has eggs/dairy, no meat)
      vegetarian: [
        {
          name: "Gold Standard Sandwich (Kale)",
          desc: "Kale, cheesy eggs, aioli, pickles, Marie Sharp's hot sauce, English muffin",
          price: 9.50,
          tags: ["v"],
        },
        {
          name: "Gold Standard Sandwich (Impossible)",
          desc: "Impossible sausage, cheesy eggs, aioli, pickles, Marie Sharp's hot sauce, English muffin",
          price: 10.50,
          tags: ["v"],
        },
        {
          name: "Impossible Melt",
          desc: "Impossible patty, American cheese, pickles, mustard, caramelized onion, special sauce, Martin's potato roll",
          price: 12.00,
          tags: ["v"],
        },
        {
          name: "Breakfast Burrito (Impossible)",
          desc: "Impossible, cheesy eggs, avocado crema, chips, chipotle salsa, jalapeño, tortilla",
          price: 17.00,
          tags: ["v"],
          note: "Queen St. exclusive",
        },
      ],

      // Vegan items
      vegan: [
        {
          name: "The Alternative",
          desc: "Vegan hummus, mustard, sprouts, mushrooms, chimichurri, pickles, pickled red onion, English muffin",
          price: 9.50,
          tags: ["vg"],
        },
      ],
    };

    const DRINKS = {
      coffee:  { name: "Coffee (Medium)", price: 2.50 },
      juice:   { name: "Juice", price: 6.50 },
      water:   { name: "Water (Flow 500mL)", price: 3.50 },
      soda:    { name: "Mexican Coca-Cola / Mate Libre", price: 4.00 },
    };

    const TAG_LABELS = { v: "V", vg: "VG" };
    const TAG_CLASSES = { v: "tag-v", vg: "tag-vg" };

    function fmt(n) {
      return "$" + n.toFixed(2);
    }

    function tagHTML(tags) {
      return tags
        .map((t) => `<span class="diet-tag ${TAG_CLASSES[t]}">${TAG_LABELS[t]}</span>`)
        .join("");
    }

    function distribute(count, items) {
      if (count <= 0 || items.length === 0) return [];
      const result = [];
      const base = Math.floor(count / items.length);
      let remainder = count - base * items.length;
      for (const item of items) {
        const qty = base + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        if (qty > 0) {
          result.push({ ...item, qty });
        }
      }
      return result;
    }

    function generateOrder() {
      const errorEl = document.getElementById("errorMsg");
      const resultsEl = document.getElementById("results");
      errorEl.textContent = "";
      resultsEl.style.display = "none";

      const total = parseInt(document.getElementById("totalPeople").value) || 0;
      const ratio = parseFloat(document.getElementById("sandwichesPerPerson").value);
      const vegCount = parseInt(document.getElementById("vegetarians").value) || 0;
      const veganCount = parseInt(document.getElementById("vegans").value) || 0;

      const addCoffee = document.getElementById("addDrinksCoffee").checked;
      const addJuice = document.getElementById("addDrinksJuice").checked;
      const addWater = document.getElementById("addDrinksWater").checked;
      const addSoda = document.getElementById("addDrinksSoda").checked;

      if (total < 1) {
        errorEl.textContent = "Please enter at least 1 person.";
        return;
      }

      if (vegCount + veganCount > total) {
        errorEl.textContent =
          "Vegetarian + vegan count exceeds total people. Please double-check your numbers.";
        return;
      }

      const totalSandwiches = Math.ceil(total * ratio);

      const veganSandwiches = Math.ceil(veganCount * ratio);
      const vegSandwiches = Math.ceil(vegCount * ratio);
      const regularSandwiches = Math.max(0, totalSandwiches - veganSandwiches - vegSandwiches);

      const orderLines = [];

      if (regularSandwiches > 0) {
        orderLines.push(...distribute(regularSandwiches, MENU.regular));
      }
      if (vegSandwiches > 0) {
        orderLines.push(...distribute(vegSandwiches, MENU.vegetarian));
      }
      if (veganSandwiches > 0) {
        orderLines.push(...distribute(veganSandwiches, MENU.vegan));
      }

      const sandwichRows = document.getElementById("sandwichRows");
      sandwichRows.innerHTML = "";
      let foodSubtotal = 0;

      for (const line of orderLines) {
        const lineTotal = line.qty * line.price;
        foodSubtotal += lineTotal;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            ${line.name}${tagHTML(line.tags)}
            <span class="item-desc">${line.desc}</span>
          </td>
          <td>${line.qty}</td>
          <td>${fmt(lineTotal)}</td>
        `;
        sandwichRows.appendChild(tr);
      }

      // Drinks
      const drinksRows = document.getElementById("drinksRows");
      const drinksSection = document.getElementById("drinksSection");
      drinksRows.innerHTML = "";
      let drinksSubtotal = 0;
      const drinkLines = [];

      if (addCoffee) drinkLines.push({ ...DRINKS.coffee, qty: total });
      if (addJuice) drinkLines.push({ ...DRINKS.juice, qty: total });
      if (addWater) drinkLines.push({ ...DRINKS.water, qty: total });
      if (addSoda) drinkLines.push({ ...DRINKS.soda, qty: total });

      if (drinkLines.length > 0) {
        drinksSection.style.display = "block";
        for (const item of drinkLines) {
          const lineTotal = item.qty * item.price;
          drinksSubtotal += lineTotal;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${fmt(lineTotal)}</td>
          `;
          drinksRows.appendChild(tr);
        }
      } else {
        drinksSection.style.display = "none";
      }

      const subtotal = foodSubtotal + drinksSubtotal;
      const serviceFee = subtotal * 0.15;
      const hst = subtotal * 0.13;
      const grandTotal = subtotal + serviceFee + hst;

      const totalsRows = document.getElementById("totalsRows");
      totalsRows.innerHTML = `
        <tr><td>Subtotal</td><td>${fmt(subtotal)}</td></tr>
        <tr><td>Service Fee (15%)</td><td>${fmt(serviceFee)}</td></tr>
        <tr><td>HST (13%)</td><td>${fmt(hst)}</td></tr>
        <tr class="total-row"><td>Estimated Total</td><td>${fmt(grandTotal)}</td></tr>
      `;

      const totalFoodQty = orderLines.reduce((s, l) => s + l.qty, 0);
      document.getElementById("summaryBanner").textContent =
        `${totalFoodQty} items for ${total} people — estimated total: ${fmt(grandTotal)} CAD`;

      resultsEl.style.display = "block";
      resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  </script>
</body>
</html>
